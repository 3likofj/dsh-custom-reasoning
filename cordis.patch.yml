# dsh-custom-reasoning bundle patch
#
# One row, dual-face: the node half is this package's default export
# (`lib/index.js`, a plain Cordis plugin declaring the plugin's own Config),
# and `package.json`'s `dsh.client` declaration makes the Web app load
# `exports["./client"]` (`lib/client.js`) as the browser half.
#
# The row name MUST equal the package name: the client-modules node half
# resolves the row's module specifier to find the owning package manifest.
- insert:
    - id: dsh-custom-reasoning
      name: dsh-custom-reasoning
